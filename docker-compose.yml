services:
  postgres:
    image: postgres:16-alpine
    container_name: vertextech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vertextech}
      POSTGRES_USER: ${POSTGRES_USER:-vertex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vertex_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vertextech-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vertex} -d ${POSTGRES_DB:-vertextech}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vertextech-postgres-data:
